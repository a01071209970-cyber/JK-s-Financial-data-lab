name: JK Financial Data Lab - Portable Regression

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-regression:
    name: Run 8 portable regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: |
          python -m py_compile tests/test_regression_v05.py
          python -m py_compile tests/run_portable_v05.py

      - name: Run portable regression suite
        run: python tests/run_portable_v05.py
